# BALANCE CONFIG — the single source of truth for every simulation constant.
#
# CONSTITUTION.md section 1.2: no number hides in code. Every value the
# simulation uses at runtime lives in this file. If you find a number in the Go
# source that should be tunable, it is a bug: move it here, comment it, and log
# the change in CHANGELOG.md with the test results that motivated it.
#
# Every constant below carries a comment saying what it does and what a
# reasonable range looks like. Ranges come from the systems in CAUSE_EFFECT.md
# read as a simulation, not from any single real-world dataset. The game is
# fictional and system-driven (CONSTITUTION.md section 6), so these are
# designed to produce interesting chains, not to reproduce a specific country.
#
# FORMAT: [section] headers, key = number or key = "string", # comments.
# Loaded by internal/config/parse.go. A key here that no system reads is a
# startup error, and a key a system needs that is absent is also an error.


[meta]
# Bumped whenever constants change shape. Recorded in run metadata so a saved
# log can be matched to the constants that produced it. Range: any string.
version = "phase1-01"

# ---------------------------------------------------------------------------
# WORLD GENERATION
# ---------------------------------------------------------------------------
# How large a world is, and how it starts. RULERS.md section 1 targets 300-800
# rulers; the generator scales to that band rather than fixing a per-town count.

[world]
years = 6                        # in-game years per default run. Range 1-20. PHASES.md wants multi-year.
min_towns = 60                   # floor on town count. Range 20-500. Below ~40 the cause web is too sparse to see chains.
max_towns = 180                  # ceiling on town count. Range 50-1000. Above ~300 tick cost per seed sweep becomes painful.
towns_per_state = 3.2            # average towns per state. Range 1-10. Sets map density.
villages_per_town = 1.8          # food villages per town. Range 0-5. Villages are the food hinterland (ECONOMY.md section 3).
rulers_per_town = 3.0            # average named rulers per town, before clamping. Range 1-10.
min_rulers = 320                 # RULERS.md section 1 lower bound. Range 50-800.
max_rulers = 700                 # RULERS.md section 1 upper bound. Range 100-800.
food_days_target = 45.0          # starting food buffer in person-days. Range 10-120. Higher is a calmer start.
start_money_per_capita = 0.55    # starting money per resident. Range 0.1-5.0.
start_metal_per_capita = 0.12    # starting industrial stock per resident. Range 0.01-1.0.
town_gold_per_capita = 0.02      # starting hard reserve per resident. Range 0-0.5. A town is a poor place to keep a war reserve.
start_gold_per_ruler = 140.0     # starting hard reserve per ruler. Range 0-2000. Buys mercenaries (ECONOMY.md section 2).
start_sanitation = 0.62          # baseline water/waste/shelter quality. Range 0.2-0.95.
medicine_per_capita = 0.02       # clinic doses per resident. Range 0-0.2. A city of 100k holds 2000 doses.
garrison_per_capita = 0.0016     # peacetime troops per resident. Range 0.0002-0.01. ~160 troops in a 100k city.
route_density = 2.4              # average connections per town. Range 1-6. Builds a sparse graph of real places, not a full mesh.
port_fraction = 0.28             # share of towns that are ports. Range 0-0.6. Ports are what a blockade can starve (chain 8).
terrain_speed = 0.72             # base travel-speed multiplier on an average road. Range 0.3-1.0.
initial_war_chance = 0.22        # per-pair probability two sides start at war. Range 0-0.6. Runs must differ without a scripted opening war.
ally_chance = 0.10               # per-pair probability two sides start allied. Range 0-0.4.
party_troops_base = 26.0         # troops a ruler fields before influence. Range 5-200.
party_troops_per_influence = 0.32 # troops per influence point. Range 0.05-2.0. Caps army size via renown (MARCH_AND_WAR.md section 8).
ruler_trait_spread = 0.34        # standard deviation of generated traits, 0-1 scale. Range 0.15-0.5.
mercenary_fraction = 0.07        # share of rulers with no land (RULERS.md section 2). Range 0-0.2.
warlord_fraction = 0.11          # share who control one town or road. Range 0-0.3.
birth_rate = 0.00046             # daily births per person in a healthy, fed town. Range 0.0001-0.0012. Roughly 0.17/yr, below replacement, so growth needs recovery.
full_food_days = 30.0            # food buffer in days at which fertility is unimpaired. Range 10-90. Scales births by how well fed a town is.
starving_birth_floor = 0.15      # share of normal births in a hand-to-mouth town. Range 0-0.5. Famine slows births, it does not stop them.

# ---------------------------------------------------------------------------
# FOOD SYSTEM — production, consumption, spoilage, trade
# ---------------------------------------------------------------------------
small_town_population = 1200.0    # smallest generated settlement. Range 100-10000.
large_town_population = 2600000.0 # largest. Range 100000-20000000.
size_exponent = 2.4               # settlement size distribution shape. Range 1-4.0. Heavy-tailed, as real sizes are.
start_unrest_max = 0.16           # highest unrest a town starts at. Range 0-0.5. A world of perfectly content towns cannot show unrest spreading.
port_prosperity_bonus = 0.10      # prosperity a port starts with above an inland town. Range 0-0.4.
village_pop_share_min = 0.10      # smallest village relative to its town. Range 0.01-0.5.
village_pop_share_max = 0.42      # largest. Range 0.1-1.0.
village_spread = 45.0             # how far a village sits from its town, in leagues. Range 5-200.
village_yield_share = 1.35        # food a villager produces for its town. Range 0.5-3.0. A village is the food hinterland.
village_food_days = 30.0          # a village's starting food buffer, in days. Range 5-120.
road_length_over_distance = 1.22  # how much longer a road is than the straight line. Range 1.0-2.0. Roads follow ground.
route_extra_roughness = 0.22      # chance a road is rougher than either town. Range 0-0.8. Rivers and ridges.
coastal_port_boost = 1.6          # port chance multiplier for coastal places. Range 1.0-5.0. The configured fraction averages over the whole map.
farmland_neighbour_leagues = 190.0 # radius within which neighbours compete for hinterland. Range 30-600.
farmland_density_scale = 26.0     # normalises local density against a settlement's own size. Range 1-200.
farmland_crowding_penalty = 0.72  # how much local crowding reduces farmland. Range 0-1.0. The food geography.
start_party_food_days = 22.0      # a party's starting food, in days. Range 3-90.
party_metal_per_troop = 12.0      # starting ammunition per soldier. Range 0-200.
party_medicine_per_troop = 0.9    # starting field medicine per soldier. Range 0-10.
min_party_troops = 18.0           # smallest party worth creating. Range 1-200.
min_raider_bands = 8.0            # fewest standing raider bands. Range 0-100.
max_raider_bands = 26.0           # most. Range 0-200.
governor_share = 0.22             # share of the non-leader roster that are governors. Range 0-0.6.
lord_share = 0.50                 # share that are lords. Range 0-1.0.
side_treasury_base = 900.0        # a side's treasury per money-rating point, squared. Range 0-10000.
side_gold_base = 60.0             # a side's gold per gold-rating point, squared. Range 0-1000.
side_metal_base = 900.0           # a side's metal per metal-rating point. Range 0-10000.
side_food_base = 140000.0         # a side's food per food-rating point. Range 0-1000000.
map_width_leagues = 2900.0        # real east-west extent, so distances are realistic. Range 500-8000.
map_height_leagues = 1700.0       # real north-south extent. Range 300-6000.

[food]
person_days_per_person_day = 1.0 # food one person eats per day. Range 0.5-2.0. The unit all buffers are measured in.
worker_food_share = 0.44         # healthy, uncrowded worker share used to size demand. Range 0.25-0.6.
base_yield_per_worker = 1.28     # food per worker per day before modifiers. Range 0.8-2.0. Slightly above demand so a healthy town can export.
farmland_factor = 0.00021       # hinterland multiplier per resident, before clamping. Range 0.00005-0.001.
farmland_min = 0.30             # floor on the farmland multiplier. Range 0.05-0.8. Industrial cities sit here.
farmland_max = 2.40             # ceiling on the farmland multiplier. Range 1.0-4.0. Rural regions sit here.
spoilage_rate = 0.0055          # daily share of stored food lost. Range 0.001-0.03. Higher with warm, unsealed storage (ECONOMY.md section 3).
spoilage_mod_sanitation = 0.45  # how much sanitation suppresses spoilage. Range 0-0.9.
shock_fraction = 0.30           # share of production lost in a harvest shock. Range 0.1-0.6.
shock_chance = 0.012            # daily probability of a harvest shock. Range 0.002-0.05. A random weather event, not a scripted event.
stock_floor = 0.0               # lowest food_stock before total loss. Range 0.
trade_in_rate = 0.55            # share of a town's surplus sellable abroad. Range 0.1-0.9.
trade_out_rate = 0.62           # share of demand meetable by imports. Range 0.1-0.9. Rich-but-hungry sides need this.
import_shortfall = 0.35         # share of demand left unmet when trade is cut. Range 0.05-0.9. Drives the blockade chain.
max_daily_net_change = 0.25     # cap on the daily food swing as a share of demand. Range 0.05-1.0. Stops one day from zeroing a year's buffer.

# ---------------------------------------------------------------------------
# STARVATION SYSTEM — empty larder to deaths, lost workers, anger
# ---------------------------------------------------------------------------

[starvation]
death_rate = 0.0055             # population share dying per day at full severity. Range 0.001-0.02.
grace_days = 4.0                # days a town survives on an empty larder before deaths. Range 2-15. TESTING_AND_BALANCE.md section 4 wants weeks, not hours.
unrest_per_day = 0.052          # unrest added per starving day. Range 0.01-0.12.
worker_loss_rate = 0.010         # worker share lost per starving day. Range 0.002-0.03.
sanitation_loss_per_day = 0.011  # hygiene degradation per starving day. Range 0.002-0.03. Weakened people keep towns dirtier, feeding disease.
loyalty_loss_per_day = 0.022    # loyalty lost per starving day. Range 0.005-0.06.
severity_at_death = 9.0         # starving days until the full death rate applies. Range 3-30. Ramps so collapse is not a cliff.
morale_hit = 0.07               # morale lost by a garrison in a starving town. Range 0.01-0.2.
crowding_death_weight = 0.50   # how much crowding worsens the death rate. Range 0-1.5. Packed rooms, weaker bodies, tighter competition for food.
sanitation_death_weight = 0.20 # the weaker way filthy streets add to deaths. Range 0-0.6. Disease killing the same people the famine weakens.
tiny_town_population = 500.0   # size above which a sub-one death rate rounds up to one death. Range 100-5000. Keeps a slow famine visible in whole-person fields.
recovery_food_days = 18.0       # buffer that must be rebuilt before the famine flag clears. Range 5-60. Stops famine flickering on and off.

# ---------------------------------------------------------------------------
# DISEASE SYSTEM — infection, deaths, medicine consumption
# ---------------------------------------------------------------------------

[disease]
base_contact_rate = 0.055       # daily transmission at crowding 0.5, sanitation 0.5, untreated. Range 0.01-0.15.
crowding_weight = 0.85          # how strongly crowding raises transmission. Range 0.2-2.0.
sanitation_weight = 0.70        # how strongly poor sanitation raises it. Range 0.2-2.0.
recovery_rate = 0.045           # daily share of the infected who recover. Range 0.01-0.12.
case_fatality = 0.0075          # infected share dying per day untreated. Range 0.001-0.03.
medicine_efficacy = 0.72        # share of new infections one dose prevents. Range 0.3-0.95.
doses_per_infected = 0.85       # doses needed to cure one infected person. Range 0.3-2.0.
worker_loss_per_infected = 0.055 # worker share lost per day per unit infection rate. Range 0.01-0.15. Sick workers cannot work.
unrest_per_death = 0.0055       # unrest added per disease death. Range 0.001-0.02.
loyalty_loss_per_death = 0.0030 # loyalty lost per disease death. Range 0.0005-0.01.
crowding_decay = 0.035          # daily relaxation of crowding with no arrivals. Range 0.005-0.1.
unrest_per_infected = 0.030     # unrest per day per unit infection rate. Range 0.005-0.08.
sanitation_loss_per_crowding = 0.020 # hygiene loss per unit of crowding. Range 0.005-0.05.
immunity_floor = 0.004          # infection share below which an outbreak is over. Range 0.0005-0.01.
medicine_decay_rate = 0.0016    # daily share of clinic stock that spoils. Range 0.0002-0.01.

# ---------------------------------------------------------------------------
# LABOR SYSTEM — people to workers, workers to output and prosperity
# ---------------------------------------------------------------------------

[labor]
healthy_worker_share = 0.46     # working-age share of a healthy population. Range 0.3-0.6.
max_worker_share = 0.62         # ceiling, so children and the elderly are never labour. Range 0.4-0.75.
min_worker_share = 0.06         # floor a devastated town can reach. Range 0.02-0.2.
worker_recovery_rate = 0.055    # daily rate sick or recovering workers return. Range 0.01-0.15. Chain 5's recovery speed.
prosperity_from_workers = 0.55  # how strongly labour drives commerce. Range 0.2-1.0.
prosperity_from_sanitation = 0.30 # how strongly public health drives commerce. Range 0.1-0.6.
prosperity_decay = 0.010        # daily prosperity loss with no support. Range 0.002-0.03.
prosperity_cap = 0.92           # ceiling from infrastructure and trade labour cannot exceed. Range 0.6-1.0.
unrest_from_unemployment = 0.014 # unrest per day when people outnumber work. Range 0.002-0.04.
unemployment_threshold = 0.28   # worker share above which that applies. Range 0.1-0.5.
unemployment_max = 0.60         # worker share where the penalty is full. Range 0.35-0.85.

# ---------------------------------------------------------------------------
# MARKET SYSTEM — prices from scarcity, and the wage spiral
# ---------------------------------------------------------------------------

[market]
base_price = 1.0                # reference food price in a well-supplied town. Range 0.5-5.0. Prices are relative to this.
price_elasticity = 2.60         # how sharply scarcity raises price. Range 1.0-6.0.
price_floor = 0.12              # lowest food price multiplier. Range 0.05-0.5.
price_cap = 14.0                # highest food price multiplier. Range 4-50. Bounds a runaway loop.
price_inertia = 0.30            # daily fraction of the gap to equilibrium price. Range 0.05-0.8. Markets move, they do not teleport.
road_safety_weight = 0.25       # how much road safety dampens local prices. Range 0-0.6.
wages_share = 0.55              # share of town output paid as wages. Range 0.3-0.8.
wage_follow_rate = 0.16         # daily rate wages track prices. Range 0.02-0.6. Slow is the wage spiral of chain 1.
scarcity_for_price = 0.85       # stock-to-demand ratio below which scarcity pricing bites. Range 0.4-1.2.
price_unrest_weight = 0.20      # how strongly the food price drives unrest. Range 0.05-0.6.
stock_target_days = 32.0        # days of demand a merchant aims to hold. Range 10-90. Chain 1's first link: high taxes pull this down.
stock_target_tax_drag = 0.75    # how far tax rate 1 drags that target. Range 0.3-1.0.
medicine_scarcity_weight = 2.20 # how sharply medical scarcity raises its price. Range 0.5-6.0.
metal_scarcity_weight = 1.10    # how sharply industrial scarcity raises its price. Range 0.3-4.0.

# ---------------------------------------------------------------------------
# CURRENCY SYSTEM — money, gold, the exchange rate, debt
# ---------------------------------------------------------------------------

[currency]
wages_per_troop = 0.55          # daily money cost of one soldier. Range 0.1-3.0.
garrison_wage_share = 0.35      # share of a town's wage bill carried by its garrison. Range 0.1-0.7.
tax_income_per_capita = 0.115   # daily tax per head at full rate and full prosperity. Range 0.02-0.4.
tax_prosperity_weight = 0.85    # how strongly prosperity multiplies tax income. Range 0.3-1.5.
tax_unrest_penalty = 0.70       # share of income lost at full unrest. Range 0.2-1.0.
tax_loyalty_penalty = 0.35      # share lost when the holder is hated. Range 0-0.8.
tax_max_rate = 0.55             # highest tax rate a ruler may set. Range 0.2-0.8.
tax_default_rate = 0.22         # rate a ruler keeps when indifferent. Range 0.05-0.4.
tax_harsh_unrest = 0.60         # unrest above which collection largely fails. Range 0.3-0.9.
building_upkeep_per_capita = 0.030 # daily money to keep a town working. Range 0.005-0.1.
market_fee_rate = 0.06          # cut of trade the town takes. Range 0-0.2.
trade_income_per_caravan = 22.0 # daily profit per delivered caravan. Range 5-80.
gold_per_money = 22.0           # baseline gold-to-money rate. Range 5-60.
conversion_cost = 0.08          # share of money lost converting to gold. Range 0-0.3.
inflation_per_deficit = 0.010   # exchange-rate drift per day of overspending, per unit of deficit. Range 0.001-0.05.
inflation_cap = 0.55            # bound on exchange-rate drift. Range 0.1-1.5.
inflation_unrest_weight = 0.22  # how much inflation feeds unrest. Range 0.05-0.6.
bankruptcy_debt_floor = -2000.0 # money balance below which a ruler borrows. Range -10000 to 0.
borrowing_per_deficit = 0.55    # debt taken per day of deficit. Range 0.1-1.0.
interest_rate = 0.0035          # daily interest on outstanding debt. Range 0.0005-0.02.
reserve_spend_rate = 0.045      # largest share of a gold reserve spent in one day. Range 0.01-0.3. Reserves empty over weeks, not overnight.
metal_use_per_troop = 0.010     # metal a soldier consumes daily for ammunition and repair. Range 0.001-0.05. ECONOMY.md section 4.
metal_make_rate = 0.55          # share of baseline industrial output at full prosperity. Range 0.1-1.5.
side_deficit_share = 0.60       # share of a side's daily deficit that becomes debt. Range 0.1-1.0. The rest is simply unpaid.
mercenary_gold = 220.0          # gold up front to hire a company. Range 50-1000.
mercenary_wage = 7.5            # daily money cost of a hired company. Range 1-40.
mercenary_value = 85.0          # value or renown a company brings. Range 10-500.
mercenary_troop_scale = 0.40    # scales a company's per-troop wage from its price. Range 0.05-2.0. Keeps the two mercenary constants consistent when tuned.

# ---------------------------------------------------------------------------
# UNREST SYSTEM — material conditions to anger
# ---------------------------------------------------------------------------

[unrest]
decay = 0.030                   # daily anger decay when conditions are good. Range 0.005-0.1.
food_shortage_weight = 1.35     # how sharply a thin larder raises anger. Range 0.3-3.0.
food_days_critical = 8.0        # food buffer in days below which shortage counts fully. Range 2-30.
tax_weight = 0.75               # how sharply taxation raises anger. Range 0.2-2.0.
tax_comfort_rate = 0.18         # tax rate a comfortable town accepts. Range 0.05-0.35.
garrison_conduct_weight = 0.55  # how sharply abusive soldiers raise anger. Range 0.1-1.5.
conduct_harsh = 0.55            # garrison conduct level above which abuse counts. Range 0.3-0.85.
death_weight = 0.011            # anger per recent death. Range 0.002-0.04.
death_memory_days = 25.0        # how long a death keeps provoking anger. Range 5-90.
propagandist_weight = 0.20      # how much influence damps unrest. Range 0-0.6. FACTIONS.md: the Pacific side has better intelligence.
propagandist_influence = 220.0  # influence at which damping is full. Range 50-600.
unrest_cap = 0.97               # ceiling. Range 0.8-1.0.
loyalty_floor_unrest = 0.50     # unrest above which loyalty starts falling. Range 0.2-0.8.

# ---------------------------------------------------------------------------
# LOYALTY SYSTEM — attachment to the current holder
# ---------------------------------------------------------------------------

[loyalty]
recover_rate = 0.021            # daily loyalty recovery when conditions are good. Range 0.003-0.06. Chain 5 climbs over weeks.
unrest_weight = 0.95            # how strongly anger erodes loyalty. Range 0.2-2.0.
tax_weight = 0.42               # how strongly a tax rate above comfort erodes loyalty. Range 0.1-1.0.
broken_promise_hit = 0.32       # loyalty lost when a pledge is broken. Range 0.1-0.7. Chain 9's first link.
raid_hit = 0.075                # loyalty lost to raiding or a passing war party. Range 0.01-0.2.
outside_offer_weight = 0.55     # how much a better offer elsewhere pulls loyalty down. Range 0.1-1.5.
outside_offer_base = 0.0012     # constant pull of being able to leave. Range 0-0.01.
service_gain = 0.0035           # loyalty gained per day of competent governance. Range 0.0005-0.015.
defection_threshold = 0.16      # loyalty at which a ruler may consider leaving. Range 0.02-0.4.
defection_loyalty_required = 0.22 # loyalty_to_leader needed before others will take them. Range 0-0.5.
loyalty_cap = 0.95              # ceiling. Range 0.7-1.0.
offer_range_leagues = 130.0     # how far a better-off neighbour can tempt people. Range 20-500. Distance is what makes a move costly.
offer_gap = 0.06                # loyalty advantage a neighbour needs before it tempts anyone. Range 0.01-0.3.
offer_proximity_weight = 0.55   # how much nearer rivals stronger the pull. Range 0-1.0. An adjacent rich town beats a distant one.

# ---------------------------------------------------------------------------
# COUNCIL SYSTEM — who holds a town
# ---------------------------------------------------------------------------
start_loyalty_min = 0.30          # least loyal a new vassal starts. Range 0-1.0. Not everyone is devoted.
start_loyalty_max = 0.95          # most loyal. Range 0-1.0.

[council]
vote_threshold = 0.26           # loyalty below which a no-confidence vote can pass. Range 0.05-0.5.
unrest_required = 0.42          # unrest a vote also requires. Range 0.1-0.8. One bad harvest must not unseat anyone.
days_below_threshold = 11.0     # days conditions must persist before a vote. Range 3-60. What makes the chain take weeks.
quorum_share = 0.34             # share of council that must be present. Range 0.1-0.8.
councilor_unrest_weight = 0.55  # how each councilor's own anger turns into a vote. Range 0.1-1.5.
councilor_loyalty_weight = 0.75 # how councilors defend the status quo. Range 0.1-2.0.
vote_chance_base = 0.020        # daily chance a vote passes once conditions are met. Range 0.002-0.1.
vote_chance_unrest_weight = 0.040 # how much unrest raises that chance. Range 0-0.15.
successor_pool_size = 6.0       # how many candidate successors are considered. Range 2-20.
instability_unrest_weight = 0.40 # how unrest destabilises a side's provinces. Range 0.1-1.0.
instability_threshold = 0.72    # unrest above which provinces start seceding. Range 0.5-0.95.
instability_daily_chance = 0.0035 # per-province daily secession chance. Range 0.0002-0.02.
loyalty_drift_per_day = 0.0007  # slow daily loyalty change in a quiet town. Range 0-0.005.
quorum_required = 0.30         # council support a vote needs to pass. Range 0.1-0.7. Stops a loud minority unseating a popular holder.
inflection_loss_on_humiliation = 40.0 # influence a ruler loses for being voted out. Range 5-200.
influence_gain_on_promotion = 30.0    # influence a new holder gains for being chosen. Range 5-200. Makes a vote a prize worth scheming for.
loyalty_after_succession = 0.42  # loyalty a town starts at with a new holder. Range 0.1-0.7. A honeymoon, not a reset: the new holder inherits the problems.
successor_range_leagues = 260.0  # how far a candidate ruler can be and still be chosen. Range 50-800. Distance limits power, not just marching.
successor_distance_weight = 0.030 # discount to a distant candidate's standing. Range 0-0.2.
successor_relation_weight = 0.55 # how much a liked candidate gains. Range 0-2.0. A vote can transfer power to an ally.
mercenary_penalty = 90.0        # discount to a landless captain as a holder. Range 0-500.
secession_loyalty_cutoff = 0.45 # loyalty_to_leader above which a province will not secede. Range 0-0.8. A ruler the leader still backs keeps their land.
secession_range_leagues = 200.0 # how far a town looks for a better side to join. Range 20-600.

# ---------------------------------------------------------------------------
# MIGRATION SYSTEM — people, and infection, on the move
# ---------------------------------------------------------------------------
loyalty_start_min = 0.55          # least loyal a town starts. Range 0-1.0. Nobody is born disloyal.
loyalty_start_max = 0.88          # most loyal. Range 0-1.0. A world starting near revolt has no room to show one.

[migration]
flee_threshold = 0.46           # unrest at which people start leaving. Range 0.2-0.8.
flee_starvation_days = 5.0      # food buffer below which flight beats flight from mere anger. Range 1-20.
flee_infected = 0.055           # infection rate that makes people flee a plague. Range 0.01-0.2.
max_flee_share = 0.016          # largest share of population leaving per day. Range 0.002-0.05. Towns empty over weeks.
flee_to_capacity_share = 0.18   # share of arrivals absorbed before crowding bites. Range 0.05-0.5. Chain 2's trigger.
crowding_per_arrival = 0.000018 # crowding added per arrival per capita. Range 0.000002-0.0001.
crowding_base = 0.30            # crowding of a town at designed capacity. Range 0.05-0.7.
crowding_cap = 1.60             # crowding representing a fully packed town. Range 1.0-3.0.
infection_carried = 0.42        # share of a fugitive's condition that arrives with them. Range 0.05-1.0. How a plague travels.
attraction_share = 0.10         # how much a healthy, rich, calm town pulls people. Range 0-0.4.
immigrants_per_day_cap = 0.014  # bound on inward movement. Range 0.002-0.05.
worker_gain_per_immigrant = 0.55 # immediate labour gain from an arrival. Range 0.2-0.9. Why chain 5's recovery is possible at all.
max_move_leagues = 220.0      # how far people will move for a better town. Range 30-1000. Bounds how far a plague travels in one wave.
desperation_weight = 0.45    # how much a starving or diseased source pushes people out regardless of the destination. Range 0-1.5. Flight spreads the disease it flees.
infection_repulsion = 3.0    # how strongly a known outbreak suppresses a town's pull, per unit infection. Range 0-10. People avoid a place they know is sick.

# ---------------------------------------------------------------------------
# SECURITY SYSTEM — roads, patrols, raiders
# ---------------------------------------------------------------------------

[security]
patrol_coverage = 0.00022       # troops per league that count as adequate patrol. Range 0.00005-0.001.
conduct_effect = 0.35           # how much abusive troops corrupt the roads they guard. Range 0-0.8. Cruel garrisons make their own area worse.
base_road_safety = 0.82         # safety of an undefended but peaceful route. Range 0.4-1.0.
