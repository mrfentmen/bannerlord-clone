trade_range_leagues = 200.0     # how far a ruler will trade. Range 20-800. Follows the roads.
trade_price_sensitivity = 1.0   # how strongly a price difference becomes a margin. Range 0.1-5.0.
blockade_import_dependency = 1.4 # how strongly a port's food-import reliance makes it worth blockading. Range 0-3.0. A region that feeds itself cannot be starved from the sea.
blockade_target_food_days = 12.0 # food buffer above which a port is less worth blockading. Range 2-60.
tax_capacity_from_prosperity = 0.28 # how much prosperity raises bearable tax. Range 0-0.8.
tax_capacity_from_unrest = 0.35 # how much anger lowers bearable tax. Range 0-1.0. Pushing further is self-defeating, not merely unpopular.
tax_generosity_weight = 0.30   # how much generosity lowers the wanted tax rate. Range 0-1.0. The most important line here: greed becomes policy without scripting.
tax_calculation_weight = 0.14  # how much calculation shapes tax policy. Range 0-0.5. A calculating ruler optimises within what the town bears.
tax_need_reference = 800.0     # treasury below which a ruler taxes hard regardless of nature. Range 0-20000.
tax_need_pressure = 0.14       # how hard such a ruler taxes. Range 0-0.5.
tax_fear_unrest_rate = 0.06     # how fast a fearful ruler pulls tax back toward bearable. Range 0-0.3.
tax_cut_loyalty_threshold = 0.40 # loyalty below which a generous ruler cuts taxes to buy it back. Range 0-1.0.
tax_change_rate = 0.012        # largest daily move in the tax rate. Range 0.001-0.1. A policy, not a switch.

# ---------------------------------------------------------------------------
# FACTION AI — the strategic layer for whole sides
# ---------------------------------------------------------------------------

[faction_ai]
declare_war_weight = 0.55       # attraction of going to war. Range 0.1-2.0.
target_weakness_weight = 0.90  # how much a soft target attracts. Range 0.1-3.0.
resource_need_weight = 0.70     # how much a food or metal shortage motivates war. Range 0.1-2.0.
exhaustion_peace_weight = 1.20  # attraction of making peace when tired. Range 0.2-3.0.
treasury_peace_weight = 0.85    # attraction of making peace when broke. Range 0.1-2.5.
offer_peace_threshold = 0.58   # exhaustion above which a side sues for peace. Range 0.2-0.9.
war_weariness_per_day = 0.0022  # daily exhaustion from an active war. Range 0.0005-0.01.
war_weariness_from_battle = 0.045 # extra weariness per battle fought. Range 0.01-0.2.
tribute_share = 0.35            # share of a defeated side's treasury demanded. Range 0.1-0.8.
vassal_tribute_rate = 0.004     # what a vassal side pays daily. Range 0.001-0.02.
raid_threshold = -0.30          # relation below which a side starts raiding. Range -0.8 to 0.
trade_pact_bonus_per_day = 0.0016 # daily relation gain from a trade pact. Range 0.0002-0.01.
ally_join_threshold = 0.42      # relation at which a side joins an ally's war. Range 0-0.8. How a coalition forms.
decide_every_days = 6.0         # how often a side takes a strategic decision. Range 1-30. Same-day decisions synchronise the world.
overmatch_ratio = 1.55          # how much stronger a rival may be before attacking stops being considered. Range 1-5.0. Without it the strongest side eats the map.
hostile_relation_threshold = -0.12 # relation below which sides are hostile enough to fight. Range -1.0 to 0.
revenge_relation_threshold = -0.45 # relation below which a war is attributed to revenge. Range -1.0 to 0.
food_need_weight = 0.60         # how much a food shortage motivates war. Range 0-2.0. ECONOMY.md section 9.
metal_need_weight = 0.35        # how much a metal shortage motivates war. Range 0-2.0.
food_need_war_threshold = 0.45  # food shortage above which a war is about hunger. Range 0-1.0.
declare_war_threshold = 0.85    # score a side must reach to commit to a war. Range 0.1-3.0.
pease_decision_threshold = 0.55 # peace score above which a side sues for peace. Range 0.1-2.0. The key name preserves its original spelling; see config.go.
peace_weariness_relief = 0.35   # fraction of war weariness surviving peace. Range 0-1.0. Exhaustion fades but does not vanish.
peace_relation_gain = 0.30     # how much two sides like each other after making peace. Range 0-1.0.
intensity_per_battle = 0.20    # how much a battle raises a war's intensity. Range 0-1.0.
vassal_strength_ratio = 1.35    # strength advantage needed to impose vassalage rather than peace. Range 1-5.0.
vassal_strength_share = 0.45    # fraction of a vassal's strength that counts. Range 0.1-1.0. Worth having, not independent.
vassal_chance_per_peace = 0.55  # chance a badly beaten side becomes a vassal. Range 0-1.0.
influence_cost_of_war = 25.0    # influence declaring a war costs the leader. Range 0-200. War is not free politically.
hostile_relation_share = 1.0    # scales the hostility term in the war score. Range 0-3.0.
act_relation_threshold = 0.20   # relation above which sides are considered to have formal ties. Range -1.0 to 1.0.
pact_relation_threshold = 0.45  # relation above which the trade-pact bonus accrues. Range 0-1.0.

# ---------------------------------------------------------------------------
# CAUSE LOG — thresholds for recording a change
# ---------------------------------------------------------------------------

[campaign]
break_morale = 0.18            # morale at which a party far from home turns back. Range 0-0.6. Chain 6 ends in a withdrawal, not a rout.
break_after_days_out = 12.0     # days away before the morale check applies. Range 1-90. A briefly unhappy party does not turn on the doorstep.
min_days_food_to_march = 6.0   # food a party must have before setting out. Range 1-40. The supply check, enforced at issue.
min_metal_to_besiege = 45.0     # metal needed to undertake a siege. Range 0-500. Without it a party camps outside and waits.
raid_range_leagues = 170.0      # how far a party will ride to raid. Range 20-600.
raid_memory_decay_days = 120.0  # how long a village remembers a raid. Range 20-600. Kept in step with ruler_ai's constant of the same name.
aid_range_leagues = 240.0       # how far a party will carry aid. Range 30-1000.
aid_food_threshold = 12.0       # food buffer below which a town needs aid. Range 2-60.
aid_load_share = 0.55           # share of a party's own larder loaded for aid. Range 0.1-1.0. Aid that were free would prove nothing about chain 5.
aid_medicine_share = 0.60        # same for field medicine. Range 0.1-1.0.
trade_range_leagues = 200.0     # how far a trade caravan will travel. Range 20-800.
trade_capital_share = 0.60      # share of a party's money committed to a trade run. Range 0.1-1.0.
attack_range_leagues = 320.0    # how far a party will march to attack. Range 50-1200.
target_food_days = 8.0          # food buffer in days at which a target is starving. Range 1-60.
garrison_advantage = 1.4        # force ratio above which a target's garrison stops being an obstacle. Range 0.5-10.0.
target_min_population_scale = 9000.0 # town size at which a target is worth the march. Range 500-200000.
tax_cut_loyalty_rate = 0.10      # tax rate the caretaker profile drops to. Range 0-0.4. Buying loyalty with the town rather than taking from it.
caretaker_medicine_stock = 2.5   # medicine buffer, as a multiple of per-capita stock, the caretaker keeps. Range 0.5-10.0.
trader_tax_ceiling = 0.28        # tax rate above which the trader profile cuts. Range 0-0.6. A tax-struck town is a bad market.
trade_min_road_safety = 0.45     # road safety below which no caravan goes out. Range 0-1.0.
aid_order_share = 0.55           # share of a party's larder loaded for a player-ordered aid run. Range 0.1-1.0.
medicine_unit_price = 0.9        # cost of one dose at a price of one. Range 0.1-10.0. Times the town's medicine price, so scarcity is priced.
fortify_metal_per_level = 40.0   # metal one level of fortification costs. Range 5-500.
fortify_morale_bonus = 0.03      # morale a town gains from being fortified. Range 0-0.2. Small and real.

[cause]
# A row per float operation would be unreadable; a chain that cannot be
# explained is worse. These thresholds are small, and every crossing is a real
# event with a real magnitude.
min_absolute = 0.0005           # smallest absolute change that logs. Range 0.00001-0.01.
min_relative = 0.0035           # smallest relative change that logs, for large fields. Range 0.0005-0.05.
max_chain_links = 200.0         # bound on why-query depth, to keep it terminating. Range 20-2000.
min_chain_links = 5.0           # depth that counts as a full explanatory chain. PHASES.md Phase 1 sets this at five.

# ---------------------------------------------------------------------------
# AUDIT — chain assertions and balance reporting
# ---------------------------------------------------------------------------

[audit]
chain_min_fraction = 0.30       # share of seeds in which a chain must appear. Range 0.05-1.0.
dominance_max_fraction = 0.60   # highest share of seeds one side may win. Range 0.3-0.9. FACTIONS.md balance rule.
sample_events_per_run = 400.0   # cause rows kept per run for review. Range 50-10000.
side_survival_threshold = 0.70 # share of starting towns a side must still hold to count as survived. Range 0.3-1.0. Measured against its own start, because the sections start unevenly.
side_collapse_threshold = 0.30 # share below which a side counts as collapsed. Range 0-0.7. The gap between the two is "held at a cost".
log_row_limit = 400000.0       # cause rows retained per run. Range 10000-5000000. A run that hits this reports how many rows it dropped.

# ---------------------------------------------------------------------------
# CAMPAIGN — turning a ruler's intention into a marching order
# ---------------------------------------------------------------------------
# The seam between the ruler AI's decision and the march system's movement.
# Player orders and scripted-profile orders use this same path, so a headless
# "dumb player" run exercises exactly the machinery a real player would.

# ---------------------------------------------------------------------------
# ELECTION — presidential elections and succession (modern-America port)
# ---------------------------------------------------------------------------
# Every faction elects a president on a fixed 4-year cycle. If the president
# dies, the VP succeeds immediately, then the line continues by influence.
# Presidents rarely leave the capital; travel multiplies assassination risk.
[election]
term_years = 4.0               # election cycle length. Range 2-8. Matches the real cycle.
max_terms = 2.0               # re-election cap. Range 1-4. Like the 22nd Amendment.
assassination_base_rate = 0.00002  # daily probability in the capital. Range 0-0.001. ~0.7%/year.
travel_risk_multiplier = 10.0 # risk multiplier when the president leaves DC. Range 1-50.
unrest_risk_scale = 0.0005    # added daily risk scaled by (1 - stability). Range 0-0.01.

