# Bannerlord-clone one-domain Worker.
#
# One page, one domain, no subdomains:
#   - /            -> Vite-built client (static assets)
#   - /api/*       -> Go API server (Container)
#   - WebSocket    -> Go API server (same Container)
#
# Deploy: wrangler deploy --config workers/router/wrangler.toml
# Requires: wrangler >= 3.90 (Containers support)

name = "bannerlord-clone"
main = "workers/router/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets: the Vite build output (clients/campaign/dist).
# `wrangler deploy` uploads these; the Worker serves them via ASSETS.
[assets]
directory = "clients/campaign/dist"
not_found_handling = "single-page-application"

# Durable Object that owns the API server Container.
[durable_objects]
bindings = [
  { name = "APISERVER", class_name = "CampaignApi" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampaignApi"]

# Container running the Go API server.
# Built from services/simulation/Dockerfile.
[[containers]]
class_name = "CampaignApi"
image = "registry.cloudflare.com/bannerlord-clone/apiserver:latest"
instances = 1
